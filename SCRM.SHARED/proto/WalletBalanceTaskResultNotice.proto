syntax = "proto3";

package Jubo.JuLiao.IM.Wx.Proto;

message WalletBankCardMessage {
  int32 CardType = 1;
  string BankName = 2;
  string CardTail = 3;
  string Desc = 4;
  string Mobile = 5;
}

message WalletBalanceTaskResultNoticeMessage {
  string WeChatId = 1;
  int32 Balance = 2;
  string TrueName = 3;
  repeated WalletBankCardMessage BankCard = 4;
  string RealNameInfo = 5; // 62203新增：实名信息描述
}
